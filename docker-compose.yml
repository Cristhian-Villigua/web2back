version: '3.8'

services:
  # Servicio de la aplicación Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app:1.0 # Nombre opcional para tu imagen
    container_name: laravel_app
    restart: unless-stopped
    ports:
      - "9000:9000" # Exponer el puerto de PHP-FPM (no directamente accesible desde el navegador)
    volumes:
      - .:/var/www/html # Montar el código de tu proyecto en el contenedor
    depends_on:
      - db # Asegurarse de que la base de datos esté lista antes de iniciar la app
    environment:
      # Variables de entorno para Laravel
      DB_CONNECTION: pgsql
      DB_HOST: db # Nombre del servicio de la base de datos en Docker Compose
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-laravel} # Nombre de tu base de datos (puedes sobrescribirlo en .env)
      DB_USERNAME: ${DB_USERNAME:-laravel} # Usuario de la base de datos
      DB_PASSWORD: ${DB_PASSWORD:-password} # Contraseña de la base de datos
      APP_ENV: production
      APP_DEBUG: false
      APP_KEY: ${APP_KEY}
      JWT_SECRET: ${JWT_SECRET} # Genera una nueva si es necesario
      # Agrega otras variables de entorno de tu archivo .env aquí si son críticas

  # Servicio de Nginx
  nginx:
    image: nginx:stable-alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "80:80" # Mapear el puerto 80 del host al puerto 80 del contenedor
    volumes:
      - .:/var/www/html # Montar el código para que Nginx lo sirva
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf # Archivo de configuración de Nginx
    depends_on:
      - app # Asegurarse de que la aplicación Laravel esté lista antes de iniciar Nginx

  # Servicio de PostgreSQL
  db:
    image: postgres:13-alpine # Puedes elegir otra versión si lo necesitas
    container_name: laravel_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/postgresql/data # Persistir los datos de la base de datos
    ports:
      - "5433:5432" # Opcional: Si necesitas acceder a la base de datos desde tu máquina host (por ejemplo, con DBeaver), puedes mapear el puerto.

volumes:
  db_data: # Definir el volumen para la base de datos